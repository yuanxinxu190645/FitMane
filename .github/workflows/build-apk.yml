name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v2.4.5'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  check:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  release:
    name: Build & Publish Release
    needs: check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Patch jni build-id
        run: |
          for f in "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt; do
            [ -f "$f" ] && sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$f" || true
          done

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/fitmane-release.jks
          keytool -list -keystore android/app/fitmane-release.jks -storepass "$KEYSTORE_PASSWORD"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fitmane-release.jks
          EOF

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Rename APKs & generate SHA-256 checksums
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     FitMane-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   FitMane-armeabi-v7a.apk
          mv app-x86_64-release.apk        FitMane-x86_64.apk
          sha256sum FitMane-arm64-v8a.apk FitMane-armeabi-v7a.apk FitMane-x86_64.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract Chinese release notes
        id: notes
        env:
          REL_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['REL_TAG'].strip()
          body = ''
          if os.path.isfile('RELEASE_NOTES.md'):
              text = open('RELEASE_NOTES.md', encoding='utf-8').read()
              m = re.search(rf'^##\s+{re.escape(tag)}\s*\n(.*?)(?=^##\s+|\Z)', text, re.M | re.S)
              if m:
                  body = m.group(1).strip()
          os.makedirs('build', exist_ok=True)
          out = 'build/release_notes.md'
          with open(out, 'w', encoding='utf-8') as f:
              f.write(body)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as gh:
              gh.write(f"has_notes={'true' if body else 'false'}\n")
          PY

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitmane-apks
          path: |
            build/app/outputs/flutter-apk/FitMane-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FitMane ${{ inputs.tag || github.ref_name }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'build/release_notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          files: |
            build/app/outputs/flutter-apk/FitMane-arm64-v8a.apk
            build/app/outputs/flutter-apk/FitMane-armeabi-v7a.apk
            build/app/outputs/flutter-apk/FitMane-x86_64.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
